{% extends "base.html" %}

{% block title %}Settings - LearnHive{% endblock %}

{% block content %}
<h1>⚙ Settings</h1>

<div style="margin-top: 32px; max-width: 600px;">
    <div class="base-card" style="padding: 24px;">
        <h3>Profile Settings</h3>
        <p style="color: var(--base-text-muted); margin-bottom: 24px;">Update your personal information and preferences.</p>
        
        <div class="base-form-group">
            <label class="base-label">Display Name</label>
            <input type="text" class="base-input" value="{{ current_user.name if current_user.is_authenticated else 'Guest' }}">
        </div>

        <div class="base-form-group">
            <label class="base-label">Email Address</label>
            <input type="email" class="base-input" value="{{ current_user.email if current_user.is_authenticated else 'guest@example.com' }}">
        </div>

        <button class="base-button">Save Changes</button>
    </div>

    <div class="base-card" style="padding: 24px; margin-top: 24px; border-color: #fee2e2;">
        <h3 style="color: #991b1b;">Danger Zone</h3>
        <p style="color: var(--base-text-muted); margin-bottom: 24px;">Irreversible actions for your account.</p>
        <button class="base-button" style="background-color: #ef4444;">Delete Account</button>
    </div>
</div>
{% endblock %}
